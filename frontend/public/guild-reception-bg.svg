<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 854" width="480" height="854">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a52" />
      <stop offset="55%" stop-color="#2a1f42" />
      <stop offset="100%" stop-color="#1c1430" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a24" />
      <stop offset="100%" stop-color="#3c2716" />
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34" />
      <stop offset="100%" stop-color="#6b4324" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="854" fill="url(#sky)" />
  <rect y="470" width="480" height="384" fill="url(#floor)" />
  <circle cx="240" cy="300" r="260" fill="url(#glow)" />

  <!-- Vitral ao fundo -->
  <g opacity="0.9">
    <rect x="170" y="90" width="140" height="190" rx="70" fill="#2a3a5c" stroke="#000" stroke-width="6" />
    <rect x="170" y="90" width="140" height="190" rx="70" fill="none" stroke="#4fd6e8" stroke-width="2" opacity="0.4" />
    <path d="M240 96 V276 M176 186 H304" stroke="#000" stroke-width="5" />
    <circle cx="240" cy="150" r="22" fill="#ffd23f" opacity="0.55" />
  </g>

  <!-- Bandeira da guilda -->
  <g>
    <rect x="60" y="130" width="10" height="220" fill="#3c2716" />
    <path d="M70 138 L150 150 L150 230 L70 220 Z" fill="#6c5ce7" stroke="#000" stroke-width="4" />
    <path d="M100 165 L120 165 L120 195 L110 205 L100 195 Z" fill="#ffd23f" />
  </g>
  <g>
    <rect x="410" y="130" width="10" height="220" fill="#3c2716" />
    <path d="M410 138 L330 150 L330 230 L410 220 Z" fill="#6c5ce7" stroke="#000" stroke-width="4" />
    <path d="M360 165 L380 165 L380 195 L370 205 L360 195 Z" fill="#ffd23f" />
  </g>

  <!-- Estantes laterais -->
  <g opacity="0.85">
    <rect x="10" y="360" width="90" height="150" fill="#4a3018" stroke="#000" stroke-width="5" />
    <rect x="20" y="372" width="70" height="18" fill="#8a5a34" />
    <rect x="20" y="400" width="70" height="18" fill="#8a5a34" />
    <rect x="20" y="428" width="70" height="18" fill="#8a5a34" />
    <rect x="26" y="374" width="8" height="14" fill="#6c5ce7" />
    <rect x="40" y="374" width="8" height="14" fill="#2ecc71" />
    <rect x="54" y="374" width="8" height="14" fill="#ff4d6d" />
    <rect x="26" y="402" width="8" height="14" fill="#ffd23f" />
    <rect x="40" y="402" width="8" height="14" fill="#4fd6e8" />
  </g>
  <g opacity="0.85">
    <rect x="380" y="360" width="90" height="150" fill="#4a3018" stroke="#000" stroke-width="5" />
    <rect x="390" y="372" width="70" height="18" fill="#8a5a34" />
    <rect x="390" y="400" width="70" height="18" fill="#8a5a34" />
    <rect x="390" y="428" width="70" height="18" fill="#8a5a34" />
    <rect x="396" y="374" width="8" height="14" fill="#ff4d6d" />
    <rect x="410" y="374" width="8" height="14" fill="#6c5ce7" />
    <rect x="424" y="374" width="8" height="14" fill="#ffd23f" />
    <rect x="396" y="402" width="8" height="14" fill="#2ecc71" />
  </g>

  <!-- Tapete -->
  <rect x="130" y="560" width="220" height="200" fill="#6c1f2e" stroke="#000" stroke-width="5" opacity="0.85" />
  <rect x="150" y="580" width="180" height="160" fill="none" stroke="#ffd23f" stroke-width="3" opacity="0.5" />

  <!-- Balcão de recepção -->
  <rect x="60" y="560" width="360" height="140" fill="url(#desk)" stroke="#000" stroke-width="6" />
  <rect x="60" y="560" width="360" height="18" fill="#a8703f" stroke="#000" stroke-width="4" />
  <rect x="90" y="600" width="60" height="70" fill="#5a3a24" stroke="#000" stroke-width="4" />
  <rect x="180" y="600" width="60" height="70" fill="#5a3a24" stroke="#000" stroke-width="4" />
  <rect x="270" y="600" width="60" height="70" fill="#5a3a24" stroke="#000" stroke-width="4" />
  <rect x="360" y="600" width="30" height="70" fill="#5a3a24" stroke="#000" stroke-width="4" />

  <!-- Sino de bronze sobre o balcão -->
  <g>
    <ellipse cx="150" cy="548" rx="16" ry="7" fill="#3c2716" />
    <path d="M138 548 Q138 522 150 522 Q162 522 162 548 Z" fill="#e8b84b" stroke="#000" stroke-width="3" />
    <circle cx="150" cy="550" r="4" fill="#3c2716" />
  </g>

  <!-- Pergaminho aberto -->
  <g>
    <rect x="240" y="536" width="70" height="26" rx="4" fill="#e8dcb8" stroke="#000" stroke-width="3" />
    <line x1="248" y1="544" x2="302" y2="544" stroke="#8a5a34" stroke-width="2" />
    <line x1="248" y1="552" x2="290" y2="552" stroke="#8a5a34" stroke-width="2" />
  </g>

  <!-- Vela -->
  <g>
    <rect x="345" y="530" width="10" height="30" fill="#e8dcb8" stroke="#000" stroke-width="2" />
    <path d="M350 520 Q346 510 350 502 Q354 510 350 520 Z" fill="#ffd23f" />
  </g>

  <!-- Vinheta para leitura -->
  <rect width="480" height="854" fill="#0f0a1e" opacity="0.12" />
